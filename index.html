<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مختبر ندى السباعي — أرشيف الخبرات والمشاريع في العمليات والتجارة الإلكترونية، التنمية الثقافية، البحث، والإنتاج البصري.">
  <meta name="theme-color" content="#ffffff">
  <title>مختبر ندى السباعي | Nada Elsebaee Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div id="site-header"></div>
  <main>
    <section class="hero wrap">
      <div class="hero-copy">
        <p class="eyebrow" data-home="eyebrow"></p>
        <h1 data-home="headline"></h1>
        <p class="hero-subtitle" data-home="subtitle"></p>
        <p class="hero-text" data-home="intro"></p>
        <div class="actions">
          <a class="button button-primary" href="archive.html" data-home="projectsCta"></a>
          <a class="button button-secondary" href="contact.html" data-home="contactCta"></a>
        </div>
        <p class="hero-proof" data-home="proof"></p>
      </div>
      <div class="hero-visual media-placeholder" role="img" data-home-aria="portraitAlt">
        <span class="placeholder-mark" aria-hidden="true">N</span>
        <span class="placeholder-caption" data-home="portraitCaption"></span>
      </div>
    </section>

    <section class="proof-strip" aria-label="Highlights">
      <div class="wrap proof-grid">
        <div><strong data-home="statYears"></strong><span data-home="statYearsLabel"></span></div>
        <div><strong data-home="statFields"></strong><span data-home="statFieldsLabel"></span></div>
        <div><strong data-home="statPartners"></strong><span data-home="statPartnersLabel"></span></div>
      </div>
    </section>

    <section class="section home-services-section" aria-labelledby="home-services-title">
      <div class="wrap">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-copy="servicesEyebrow">مساحات للتعاون</p>
            <h2 id="home-services-title" data-copy="servicesTitle">خدمات تجمع الرؤية بالتنفيذ</h2>
            <p class="home-services-intro" data-copy="servicesIntro">حلول عملية مصممة للشركات والمنظمات غير الحكومية والكيانات الثقافية والمشاريع الإعلامية.</p>
          </div>
          <a class="text-link" href="services.html" data-copy="servicesMore">استكشاف الخدمات</a>
        </div>
        <div class="home-services-stage">
          <div class="service-grid home-service-grid" id="home-services"></div>
        </div>
      </div>
    </section>

    <section class="section home-studio-section" aria-labelledby="home-studio-title">
      <div class="wrap home-studio-panel">
        <div class="home-studio-art" aria-hidden="true">
          <span class="home-studio-orbit home-studio-orbit-one"></span>
          <span class="home-studio-orbit home-studio-orbit-two"></span>
          <span class="home-studio-play">▶</span>
        </div>
        <div class="home-studio-copy">
          <p class="eyebrow" data-copy="studioEyebrow"></p>
          <h2 id="home-studio-title" data-copy="studioTitle"></h2>
          <p data-copy="studioIntro"></p>
          <a class="button button-primary" href="studio.html" data-copy="studioCta"></a>
        </div>
      </div>
    </section>

    <section class="section wrap">
      <div class="section-heading">
        <div><p class="eyebrow" data-home="featuredEyebrow"></p><h2 data-home="featuredTitle"></h2></div>
        <a class="text-link" href="archive.html" data-home="viewArchive"></a>
      </div>
      <div class="experience-timeline" id="experience-timeline" aria-label="الخط الزمني للخبرات"></div>
      <div class="experience-carousel-controls">
        <button class="carousel-arrow carousel-arrow-previous" id="experience-previous" type="button" aria-label="الخبرة الأحدث">‹</button>
        <button class="carousel-arrow carousel-arrow-next" id="experience-next" type="button" aria-label="الخبرة الأقدم">›</button>
      </div>
      <div class="experience-carousel" id="experience-carousel">
        <div class="project-grid experience-track" id="featured-projects"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
