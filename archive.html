<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="أرشيف خبرات ومشاريع ندى السباعي.">
  <title>أرشيف الخبرات والمشاريع | مختبر ندى السباعي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="archive">
  <div id="site-header"></div>
  <main class="wrap page-main">
    <header class="page-intro">
      <p class="eyebrow" data-copy="archiveEyebrow"></p>
      <h1 data-copy="archiveTitle"></h1>
      <p class="lead" data-copy="archiveIntro"></p>
    </header>
    <div class="archive-toolbar">
      <div class="filter-bar" id="archive-filters" role="group"></div>
      <p class="results-count" id="results-count" aria-live="polite"></p>
    </div>
    <div class="timeline-layout">
      <nav class="year-timeline" id="year-timeline" aria-label="الخط الزمني حسب السنة"></nav>
      <section class="timeline-results" id="archive-results" aria-live="polite"></section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
